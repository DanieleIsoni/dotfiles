#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json
[[session]]
name = " home"
path = "~"

[[session]]
name = "📥 downloads"
path = "~/Downloads/"
startup_command = "y"

[[session]]
name = " dotfiles"
path = "~/dotfiles/"
startup_command = "nvim"

[[session]]
name = " nvim"
path = "~/dotfiles/config/nvim/"
